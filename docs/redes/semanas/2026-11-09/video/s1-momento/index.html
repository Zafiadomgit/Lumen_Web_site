<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/lumen.js"></script>
    <link rel="stylesheet" href="assets/css/lumen.css" />
    <style>
      #champ { --s: 376px; }
      #phone { left: 560px; top: 590px; }
      #b2 { font-size: 40px; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="llama-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" /><stop offset="1" stop-color="#e8862c" /></linearGradient>
        <symbol id="lumen-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="currentColor" /><path d="M32 14c8 9 12 15 12 21.5a12 12 0 0 1-24 0C20 29 24 23 32 14z" fill="url(#llama-g)" /><path d="M32 30c3 3.5 4.5 6 4.5 8.5a4.5 4.5 0 0 1-9 0c0-2.5 1.5-5 4.5-8.5z" fill="#fff4dc" /></symbol>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.3" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="14.3" data-track-index="0" data-layout-ignore style="position:absolute;inset:0;z-index:1">
        <div id="glow"></div><div id="glow2"></div><div id="embers"></div>
      </div>

      <div id="kicker" class="kicker clip" data-start="0" data-duration="11.5" data-track-index="1" style="z-index:3"><i></i><span>Champi, en nuestra web</span><i></i></div>
      <h1 id="h1" class="head clip" data-start="0" data-duration="3.5" data-track-index="2" style="z-index:4"><span class="w">Toca</span> <span class="w">a</span> <span class="w">Champi</span><br /><span class="w">y</span> <span class="w">te</span> <span class="w"><em>responde</em></span></h1>
      <h1 id="h2" class="head clip" data-start="3.5" data-duration="4.6" data-track-index="2" style="z-index:4"><span class="w">…cuando</span> <span class="w">llega</span><br /><span class="w">a</span> <span class="w">su</span> <span class="w"><em>rincón</em></span></h1>
      <h1 id="h3" class="head clip" data-start="8.1" data-duration="3.4" data-track-index="2" style="z-index:4"><span class="w">Pregúntale</span><br /><span class="w">lo</span> <span class="w">que</span> <span class="w"><em>quieras</em></span></h1>

      <div id="stage" class="clip" data-start="0" data-duration="11.7" data-track-index="3" data-layout-allow-overlap style="z-index:2">
        <div class="floor" style="top:1250px"></div>
        <div class="phone" id="phone"><div class="screen">
          <div class="sc" id="sc-web" style="opacity:1;background-image:url(assets/img/movil-portada.webp)"></div>
          <div class="sc" id="sc-chat" style="background-image:url(assets/img/movil-chat.webp)"></div>
          <div class="notch"></div>
        </div></div>
        <div class="ch" id="champ"><div class="spr walk"></div><div class="spr idle"></div><div class="spr wave"></div></div>
        <div class="finger" id="finger"></div>
        <div class="bubble" id="b1">¡Dame un momento!</div>
        <div class="bubble" id="b2">Uff, me cansé…<br />Aquí no te molesto.</div>
      </div>

      <div id="outro" class="clip" data-start="11.5" data-duration="2.8" data-track-index="4" style="z-index:5">
        <div class="farol"></div>
        <div class="champi"></div>
        <p class="slogan" id="slogan"><span class="w">Encendemos</span><br /><span class="w">tus</span> <span class="w"><em>ideas.</em></span></p>
        <p class="sign" id="sign"><svg aria-hidden="true"><use href="#lumen-mark" /></svg><b>Lumen Studio</b><span>· link en la bio</span></p>
      </div>
    </div>
    <script>
      const END = 14.3, S = 376, FLOOR = 1250;
      const tl = gsap.timeline({ paused: true });
      const L = Lumen(tl, END);
      gsap.set("#champ", { x: 352, y: FLOOR - S, opacity: 1, scale: 1, transformOrigin: "50% 100%" });
      gsap.set("#phone", { y: 1300, opacity: 0 });

      // 1 · Champi en el centro; un toque y pide un momento
      L.pose("#champ", 0, "idle");
      L.cycle("#champ .idle", 8, S, 0, 3.5, 8);
      const f = L.finger("#finger");
      f.tap(1.5, 545, 1090); f.leave(1.85);
      tl.to("#champ", { scaleY: 0.86, scaleX: 1.08, duration: 0.08, ease: "power2.in" }, 1.52)
        .to("#champ", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2.2)" }, 1.6);
      tl.fromTo("#b1", { x: 430, y: 790, opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.75)
        .to("#b1", { opacity: 0, duration: 0.18, ease: "power1.in" }, 3.35);

      // 2 · sale corriendo a toda velocidad…
      L.pose("#champ", 3.5, "walk");
      L.cycle("#champ .walk", 6, S, 3.5, 5.6, 18);
      tl.to("#champ", { scaleY: 0.9, scaleX: 1.06, duration: 0.1, ease: "power2.in" }, 3.5)
        .to("#champ", { x: 1250, scaleY: 1, scaleX: 1, duration: 0.55, ease: "power2.in" }, 3.6);
      tl.fromTo("#champ", { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.5, ease: "power2.in" }, 3.65);
      // …y vuelve, pequeño, hasta su rincón, al lado de la web
      tl.fromTo("#phone", { y: 1300, rotation: 6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 4.3);
      tl.set("#champ", { x: -420, scale: 0.7, filter: "blur(4px)" }, 4.6)
        .to("#champ", { x: 120, duration: 0.85, ease: "power3.out" }, 4.6)
        .to("#champ", { filter: "blur(0px)", duration: 0.3, ease: "power1.out" }, 4.9);
      L.pose("#champ", 5.5, "idle");
      L.cycle("#champ .idle", 8, S, 5.5, 11.7, 8);
      // resopla
      for (let i = 0; i < 4; i++) tl.to("#champ", { scaleY: 0.64, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.6 + i * 0.55);
      tl.fromTo("#b2", { x: 50, y: 760, opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 5.7)
        .to("#b2", { opacity: 0, duration: 0.18, ease: "power1.in" }, 7.95);

      // 3 · el chat de la web contesta de verdad
      tl.to("#phone", { x: -170, y: 60, scale: 1.25, duration: 0.6, ease: "power2.inOut" }, 8.1);
      tl.to("#champ", { x: 10, duration: 0.6, ease: "power2.inOut" }, 8.1);
      tl.to("#sc-chat", { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 8.55);
      tl.to("#stage", { opacity: 0, filter: "blur(12px)", duration: 0.4, ease: "power3.in" }, 11.2);

      // titulares
      L.wordsOut("#h1", 3.3);
      L.wordsIn("#h2", 3.55); L.wordsOut("#h2", 7.9);
      L.lineIn("#h3", 8.15);  L.wordsOut("#h3", 11.25); L.out("#kicker", 11.25);

      L.outro(11.5);
      L.embers(67);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
