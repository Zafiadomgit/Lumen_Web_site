<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/lumen.js"></script>
    <link rel="stylesheet" href="assets/css/lumen.css" />
    <style>
      /* farol colgado: gira alrededor del punto de donde cuelga */
      #swing { position: absolute; left: 290px; top: 560px; width: 500px; height: 620px; }
      #chain { position: absolute; left: 248px; top: 0; width: 4px; height: 168px; background: linear-gradient(#5a4a2a, #c99a3e); border-radius: 2px; }
      #lamp { position: absolute; left: 10px; top: 80px; width: 480px; height: 480px; background: url("assets/img/farol-tira.webp") 0 0 / 3840px 480px repeat-x; image-rendering: pixelated; }
      #halo { position: absolute; left: 140px; top: 560px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(255,196,96,.30), transparent 62%); }
      .spark { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ffd27a; box-shadow: 0 0 18px 6px rgba(232,182,76,.8); opacity: 0; }
      .count { position: absolute; left: 760px; top: 640px; font-weight: 800; font-size: 120px; color: var(--gold); opacity: 0; text-shadow: 0 0 40px rgba(232,182,76,.5); }
      #phone { left: 370px; top: 590px; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="llama-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" /><stop offset="1" stop-color="#e8862c" /></linearGradient>
        <symbol id="lumen-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="currentColor" /><path d="M32 14c8 9 12 15 12 21.5a12 12 0 0 1-24 0C20 29 24 23 32 14z" fill="url(#llama-g)" /><path d="M32 30c3 3.5 4.5 6 4.5 8.5a4.5 4.5 0 0 1-9 0c0-2.5 1.5-5 4.5-8.5z" fill="#fff4dc" /></symbol>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.2" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="13.2" data-track-index="0" data-layout-ignore style="position:absolute;inset:0;z-index:1">
        <div id="glow"></div><div id="glow2"></div><div id="embers"></div>
      </div>

      <div id="kicker" class="kicker clip" data-start="0" data-duration="10.4" data-track-index="1" style="z-index:3"><i></i><span>Reto Lumen</span><i></i></div>
      <h1 id="h1" class="head clip" data-start="0" data-duration="2.4" data-track-index="2" style="z-index:4"><span class="w">Golpea</span><br /><span class="w">el</span> <span class="w"><em>farol</em></span></h1>
      <h1 id="h2" class="head clip" data-start="2.4" data-duration="3.7" data-track-index="2" style="z-index:4"><span class="w">¿Cuántas</span> <span class="w">veces</span><br /><span class="w">lo</span> <span class="w">haces</span> <span class="w"><em>balancear?</em></span></h1>
      <h1 id="h3" class="head clip" data-start="6.1" data-duration="2.3" data-track-index="2" style="z-index:4"><span class="w">Está</span> <span class="w">en</span><br /><span class="w">nuestra</span> <span class="w"><em>web</em></span></h1>
      <h1 id="h4" class="head clip" data-start="8.4" data-duration="2.0" data-track-index="2" style="z-index:4"><span class="w">Cuéntanos</span> <span class="w">tu</span><br /><span class="w"><em>récord</em></span></h1>

      <div id="stage" class="clip" data-start="0" data-duration="6.6" data-track-index="3" data-layout-allow-overlap style="z-index:2">
        <div id="halo"></div>
        <div id="swing"><div id="chain"></div><div id="lamp"></div></div>
        <div id="sparks"></div>
        <div class="count" id="c1">×1</div><div class="count" id="c2">×2</div><div class="count" id="c3">×3</div><div class="count" id="c4">×4</div>
        <div class="finger" id="finger"></div>
      </div>

      <div id="phonewrap" class="clip" data-start="6.0" data-duration="4.7" data-track-index="3" style="z-index:2">
        <div class="phone" id="phone"><div class="screen"><div class="sc" style="opacity:1;background-image:url(assets/img/movil-portada.webp)"></div><div class="notch"></div><div class="finger" id="finger2"></div></div></div>
      </div>

      <div id="outro" class="clip" data-start="10.4" data-duration="2.8" data-track-index="4" style="z-index:5">
        <div class="farol"></div>
        <div class="champi"></div>
        <p class="slogan" id="slogan"><span class="w">Encendemos</span><br /><span class="w">tus</span> <span class="w"><em>ideas.</em></span></p>
        <p class="sign" id="sign"><svg aria-hidden="true"><use href="#lumen-mark" /></svg><b>Lumen Studio</b><span>· link en la bio</span></p>
      </div>
    </div>
    <script>
      const END = 13.2;
      const tl = gsap.timeline({ paused: true });
      const L = Lumen(tl, END);
      L.cycle("#lamp", 8, 480, 0, 6.6, 8.9);

      // golpes: el farol se balancea como un péndulo amortiguado; cada golpe suma su vaivén
      const HITS = [[1.1, 15], [3.0, 20], [3.95, 24], [4.85, 30]];
      const HX = 440, HY = 930;   // donde golpea el dedo (lado izquierdo del farol)
      const box = document.getElementById("sparks");
      const sparks = HITS.map((h, i) => Array.from({ length: 14 }, (_, j) => {
        const e = document.createElement("i"); e.className = "spark"; box.appendChild(e);
        const a = Math.PI * (0.55 + 0.9 * ((j * 37 + i * 11) % 14) / 14), v = 380 + ((j * 53 + i * 29) % 7) * 70;
        return { e, t0: h[0], vx: Math.cos(a) * v, vy: -Math.abs(Math.sin(a)) * v * 1.1 };
      })).flat();
      const clock = { t: 0 };
      const render = () => {
        const t = clock.t;
        let r = 0;
        for (const [t0, A] of HITS) if (t > t0) { const d = t - t0; r += -A * Math.exp(-d * 1.3) * Math.sin(2 * Math.PI * 0.85 * d); }
        gsap.set("#swing", { rotation: r, transformOrigin: "50% 0%" });
        for (const s of sparks) {
          const d = t - s.t0;
          if (d < 0 || d > 0.8) { gsap.set(s.e, { opacity: 0 }); continue; }
          gsap.set(s.e, { x: HX + s.vx * d, y: HY + s.vy * d + 1100 * d * d, opacity: 1 - d / 0.8, scale: 1 - d * 0.8 });
        }
      };
      tl.fromTo(clock, { t: 0 }, { t: 6.6, duration: 6.6, ease: "none", onUpdate: render }, 0);
      render();

      // el dedo golpea; el contador sube
      const f = L.finger("#finger");
      HITS.forEach(([t], i) => {
        f.tap(t, HX - 20, HY + 10);
        if (i) tl.set("#c" + i, { opacity: 0 }, t);
        tl.fromTo("#c" + (i + 1), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.02);
      });
      f.leave(5.4);
      tl.to("#c4", { opacity: 0, duration: 0.2 }, 5.9);

      // titulares
      L.wordsOut("#h1", 2.2);
      L.wordsIn("#h2", 2.45); L.wordsOut("#h2", 5.9);
      L.lineIn("#h3", 6.15);  L.wordsOut("#h3", 8.2);
      L.wordsIn("#h4", 8.45); L.wordsOut("#h4", 10.15); L.out("#kicker", 10.15);

      // el farol se aleja y sube el celular con la web de verdad
      tl.to("#swing, #halo", { opacity: 0, scale: 0.8, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 6.0);
      tl.fromTo("#phone", { y: 1300, rotation: 6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 6.1);
      const f2 = L.finger("#finger2");
      f2.tap(7.6, 156, 230); f2.tap(8.2, 150, 222); f2.tap(8.75, 160, 226); f2.leave(9.3);
      tl.to("#phone", { opacity: 0, scale: 0.86, filter: "blur(12px)", duration: 0.45, ease: "power3.in" }, 10.1);

      L.outro(10.4);
      L.embers(41);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
