<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/lumen.js"></script>
    <link rel="stylesheet" href="assets/css/lumen.css" />
    <style>
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
      .kicker { top: 196px; }
      .head { top: 252px; font-size: 86px; }
      #h1 { font-size: 72px; top: 262px; }

      /* ventana del navegador con el farol de la web */
      #win { position: absolute; left: 60px; top: 478px; width: 960px; height: 362px; border-radius: 28px; overflow: hidden; background: #0d0c11;
        box-shadow: 0 50px 110px rgba(0,0,0,.6), inset 0 0 0 2px rgba(232,182,76,.22); }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #17151c; border-bottom: 1px solid rgba(255,255,255,.06); }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a3640; }
      .dot:nth-child(1) { background: #e0675a; } .dot:nth-child(2) { background: #e2b549; } .dot:nth-child(3) { background: #5fb760; }
      .url { margin-left: 18px; flex: 1; height: 30px; border-radius: 15px; background: #0d0c11; color: var(--muted); font-weight: 700; font-size: 18px; display: flex; align-items: center; padding: 0 18px; gap: 10px; }
      .url b { color: var(--ink); font-weight: 700; }
      .page { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; overflow: hidden;
        background: radial-gradient(420px 300px at 50% 52%, rgba(232,182,76,.20), transparent 70%), #0d0c11; }
      #halo { position: absolute; left: 330px; top: 20px; width: 300px; height: 300px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,196,90,.34) 0, rgba(255,196,90,.10) 34%, rgba(255,196,90,0) 66%); }
      #lamp { position: absolute; left: 375px; top: 22px; width: 210px; height: 210px; transform-origin: 50% 6%; }
      #lamp .farol { position: absolute; inset: 0; background: url("assets/img/farol-tira.webp") 0 0 / 1680px 210px repeat-x; image-rendering: pixelated; }
      .site { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: "Cinzel", serif; font-weight: 700; font-size: 34px; letter-spacing: .02em; color: var(--ink); }
      .site em { font-style: normal; color: var(--gold); }
      #sparks { position: absolute; inset: 0; pointer-events: none; }
      .spark { position: absolute; left: 0; top: 0; border-radius: 1px; background: #ffd76a; box-shadow: 0 0 10px 2px rgba(255,200,90,.55); opacity: 0; }
      #win .finger { z-index: 3; }

      /* editor con el código real de js/main.js */
      #ed { position: absolute; left: 60px; top: 868px; width: 960px; height: 460px; border-radius: 28px; overflow: hidden; background: #141218;
        box-shadow: 0 50px 110px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.07); }
      #ed .bar { justify-content: flex-start; }
      .file { margin-left: 18px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 19px; color: var(--muted); }
      .file b { color: var(--ink); }
      .tag { margin-left: auto; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 16px; color: #0a090d; background: var(--gold); border-radius: 8px; padding: 3px 10px; }
      .code { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; padding: 20px 0; }
      #hl { position: absolute; left: 0; right: 0; top: 20px; height: 37px; background: rgba(232,182,76,.15); box-shadow: inset 5px 0 0 var(--gold); opacity: 0; }
      .pane { position: absolute; left: 0; right: 0; top: 20px; }
      .ln { height: 37px; line-height: 37px; padding: 0 28px; white-space: pre; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; color: #e9e4d8; }
      .ln .k { color: #e8b64c; font-weight: 700; } .ln .n { color: #f0a66b; } .ln .s { color: #9fd39a; } .ln .c { color: #948e81; } .ln .x { color: #948e81; }
      .ln .f { color: #8fc3ea; }

      #outro .sign span { color: var(--muted); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="llama-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" /><stop offset="1" stop-color="#e8862c" /></linearGradient>
        <symbol id="lumen-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="currentColor" /><path d="M32 14c8 9 12 15 12 21.5a12 12 0 0 1-24 0C20 29 24 23 32 14z" fill="url(#llama-g)" /><path d="M32 30c3 3.5 4.5 6 4.5 8.5a4.5 4.5 0 0 1-9 0c0-2.5 1.5-5 4.5-8.5z" fill="#fff4dc" /></symbol>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="16" data-track-index="0" data-layout-ignore style="position:absolute;inset:0;z-index:1">
        <div id="glow"></div><div id="glow2"></div><div id="embers"></div>
      </div>

      <div id="kicker" class="kicker clip" data-start="0" data-duration="12.5" data-track-index="1" style="z-index:3"><i></i><span>Detrás del código</span><i></i></div>

      <h1 id="h1" class="head clip" data-start="0" data-duration="2.6" data-track-index="2" style="z-index:4"><span class="w">Así</span> <span class="w">se</span> <span class="w">programa</span><br /><span class="w">un</span> <span class="w">farol</span> <span class="w">que</span> <span class="w">se</span> <span class="w"><em>balancea</em></span></h1>
      <h1 id="h2" class="head clip" data-start="2.6" data-duration="3.8" data-track-index="2" style="z-index:4"><span class="w">Un</span> <span class="w"><em>muelle</em></span><br /><span class="w">con</span> <span class="w">rozamiento</span></h1>
      <h1 id="h3" class="head clip" data-start="6.4" data-duration="3.6" data-track-index="2" style="z-index:4"><span class="w"><em>14</em></span> <span class="w"><em>chispas</em></span><br /><span class="w">en</span> <span class="w">cada</span> <span class="w">golpe</span></h1>
      <h1 id="h4" class="head clip" data-start="10" data-duration="2.6" data-track-index="2" style="z-index:4"><span class="w">Tócalo</span> <span class="w">tú</span><br /><span class="w">en</span> <span class="w"><em>nuestra</em></span> <span class="w"><em>web</em></span></h1>

      <div id="stage" class="clip" data-start="0" data-duration="13" data-track-index="3" style="position:absolute;inset:0;z-index:2">
        <div id="win">
          <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="url">🔒 <b>lumenestudio.tech</b></div></div>
          <div class="page">
            <div id="halo"></div>
            <div id="lamp"><div class="farol"></div></div>
            <p class="site">Lumen <em>Studio</em></p>
            <div id="sparks"></div>
            <div class="finger" id="finger"></div>
          </div>
        </div>
        <div id="ed">
          <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="file">js/<b>main.js</b></span><span class="tag">1b · farol</span></div>
          <div class="code">
            <div id="hl"></div>
            <div class="pane" id="p1"></div>
            <div class="pane" id="p2"></div>
            <div class="pane" id="p3"></div>
          </div>
        </div>
      </div>

      <div id="outro" class="clip" data-start="12.6" data-duration="3.4" data-track-index="4" style="z-index:5">
        <div class="farol"></div>
        <div class="champi"></div>
        <p class="slogan" id="slogan"><span class="w">Encendemos</span><br /><span class="w">tus</span> <span class="w"><em>ideas.</em></span></p>
        <p class="sign" id="sign"><svg aria-hidden="true"><use href="#lumen-mark" /></svg><b>Lumen Studio</b><span>· lumenestudio.tech</span></p>
      </div>
    </div>
    <script>
      const END = 16;
      const tl = gsap.timeline({ paused: true });
      const L = Lumen(tl, END);

      // ---------- código real de js/main.js (sección 1b); «…» = líneas que se saltan ----------
      const PANES = {
        p1: [
          "// rigidez del muelle, rozamiento y ángulo máximo (grados)",
          "var K = 55, DAMP = 2.1, MAX = 38;",
          "…",
          "var hit = function (x, y) {",
          "  …",
          "  vel += dir * 260 * force;",
          "  sparks(x, y, dir);",
          "  …",
          "};",
        ],
        p2: [
          "var step = function (t) {",
          "  var dt = Math.min(0.032, (t - last) / 1000 || 0.016); last = t;",
          "  vel += (-K * ang - DAMP * vel) * dt;",
          "  ang += vel * dt;",
          "  if (ang > MAX) { ang = MAX; vel *= -0.4; } …",
          "  lampBtn.style.transform = 'rotate(' + ang.toFixed(2) + 'deg)';",
          "  …",
          "  requestAnimationFrame(step);",
          "};",
        ],
        p3: [
          "var sparks = function (x, y, dir) {",
          "  if (reduce) return;",
          "  for (var i = 0; i < 14; i++) {",
          "    var sp = document.createElement('span');",
          "    sp.className = 'spark';",
          "    …",
          "    var sz = 3 + Math.random() * 5;",
          "    if (Math.random() < 0.35) sp.style.background = '#fff3c4';",
        ],
      };
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const paint = (line) => {
        const re = /(\/\/.*$)|('[^']*')|\b(var|function|if|for|return)\b|\b(\d+(?:\.\d+)?)\b|(…)|\b([A-Za-z_]\w*)(?=\s*\()/g;
        let out = "", last = 0, m;
        while ((m = re.exec(line))) {
          out += esc(line.slice(last, m.index));
          const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "n" : m[5] ? "x" : "f";
          out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
          last = re.lastIndex;
        }
        return out + esc(line.slice(last));
      };
      for (const id in PANES) document.getElementById(id).innerHTML = PANES[id].map((l) => '<div class="ln">' + paint(l) + "</div>").join("");
      gsap.set(".pane", { opacity: 0 });

      // panel de código que entra línea a línea y la línea que se explica en dorado
      const LH = 37;
      let curPane = null;
      const pane = (id, t) => {
        if (curPane) tl.to(curPane, { opacity: 0, y: -26, duration: 0.25, ease: "power2.in" }, t - 0.25);
        tl.set("#" + id, { opacity: 1, y: 0 }, t);
        tl.fromTo("#" + id + " .ln", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.22, stagger: 0.04, ease: "power2.out" }, t);
        tl.to("#hl", { opacity: 0, duration: 0.15 }, t - 0.25);
        curPane = "#" + id;
      };
      const hl = (id, i, t) => {
        tl.set("#hl", { y: i * LH }, t - 0.01);
        tl.fromTo("#hl", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
        tl.to("#" + id + " .ln", { opacity: (k) => (k === i ? 1 : 0.42), duration: 0.25, ease: "power2.out" }, t);
      };

      // ---------- física del farol: mismos números y mismos pasos que js/main.js ----------
      const K = 55, DAMP = 2.1, MAX = 38, FPS = 60;
      const LAMP = { x: 375, y: 22, w: 210, h: 210 };            // en coordenadas de .page
      const HITS = [ { t: 1.45, side: 1 }, { t: 7.0, side: -1 }, { t: 10.5, side: 1 } ]; // side 1 = golpe por la derecha
      const hitPoint = (side) => ({ x: LAMP.x + LAMP.w / 2 + side * LAMP.w * 0.35, y: LAMP.y + LAMP.h * 0.55 });
      const angles = new Float32Array(Math.ceil(END * FPS) + 2);
      { let ang = 0, vel = 0, swinging = false, h = 0;
        for (let f = 0; f < angles.length; f++) {
          const t = f / FPS;
          while (h < HITS.length && HITS[h].t <= t) {
            const p = hitPoint(HITS[h].side);
            const dir = p.x < LAMP.x + LAMP.w / 2 ? 1 : -1;    // golpe desde la izquierda → se va a la derecha
            const force = 0.6 + Math.min(1, Math.abs(p.x - (LAMP.x + LAMP.w / 2)) / (LAMP.w / 2)) * 0.6;
            vel += dir * 260 * force; swinging = true; h++;
          }
          if (swinging) {
            const dt = 1 / FPS;
            vel += (-K * ang - DAMP * vel) * dt;
            ang += vel * dt;
            if (ang > MAX) { ang = MAX; vel *= -0.4; } else if (ang < -MAX) { ang = -MAX; vel *= -0.4; }
            if (Math.abs(ang) < 0.25 && Math.abs(vel) < 2) { swinging = false; ang = 0; vel = 0; }
          }
          angles[f] = ang;
        } }
      const lampClock = { t: 0 };
      const drawLamp = () => gsap.set("#lamp", { rotation: angles[Math.min(angles.length - 1, Math.round(lampClock.t * FPS))] });
      tl.fromTo(lampClock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: drawLamp }, 0);
      drawLamp();
      L.cycle("#lamp .farol", 8, 210, 0, 13, 9);

      // dedo y chispas (14 por golpe, semilla fija en vez de Math.random)
      let seed = 1831;
      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const box = document.getElementById("sparks");
      for (const H of HITS) {
        const p = hitPoint(H.side);
        const dir = p.x < LAMP.x + LAMP.w / 2 ? 1 : -1;
        tl.fromTo("#finger", { x: p.x + H.side * 150, y: p.y + 170, opacity: 0, scale: 1 }, { x: p.x, y: p.y, opacity: 1, duration: 0.42, ease: "power3.out" }, H.t - 0.45);
        tl.to("#finger", { scale: 0.78, duration: 0.08, ease: "power2.in" }, H.t - 0.03).to("#finger", { scale: 1, duration: 0.2, ease: "power3.out" }, H.t + 0.05);
        tl.to("#finger", { x: p.x + H.side * 120, y: p.y + 140, opacity: 0, duration: 0.35, ease: "power2.in" }, H.t + 0.3);
        tl.fromTo("#halo", { scale: 1.25, opacity: 1 }, { scale: 1, opacity: 0.85, duration: 0.6, ease: "power2.out" }, H.t);
        for (let i = 0; i < 14; i++) {
          const sp = document.createElement("i"); sp.className = "spark"; box.appendChild(sp);
          const a = (-90 + dir * 35 + (rnd() - 0.5) * 140) * Math.PI / 180;
          const d = (50 + rnd() * 110) * 1.25, dx = Math.cos(a) * d, dy = Math.sin(a) * d;
          const sz = (3 + rnd() * 5) * 1.9;
          sp.style.width = sp.style.height = sz.toFixed(1) + "px";
          if (rnd() < 0.35) sp.style.background = "#fff3c4";
          const life = 0.55 + rnd() * 0.45;
          tl.fromTo(sp, { x: p.x, y: p.y, scale: 1 }, { x: p.x + dx, y: p.y + dy + 60, scale: 0.2, duration: life, ease: "expo.out", immediateRender: false }, H.t);
          tl.fromTo(sp, { opacity: 1 }, { opacity: 0, duration: life, ease: "power2.in", immediateRender: false }, H.t);
        }
      }

      // ---------- código y titulares ----------
      tl.set("#p1", { opacity: 1 }, 0);   // el código ya está en el primer cuadro
      curPane = "#p1";
      hl("p1", 1, 0.45);
      hl("p1", 5, 1.45);
      L.wordsOut("#h1", 2.4);

      L.wordsIn("#h2", 2.65);
      pane("p2", 2.75);
      hl("p2", 2, 3.3);
      hl("p2", 3, 4.4);
      hl("p2", 5, 5.4);
      L.wordsOut("#h2", 6.2);

      L.wordsIn("#h3", 6.45);
      pane("p3", 6.5);
      hl("p3", 2, 7.0);
      hl("p3", 7, 8.4);
      L.wordsOut("#h3", 9.8);

      L.wordsIn("#h4", 10.05);
      tl.to("#ed", { opacity: 0, y: 60, filter: "blur(6px)", duration: 0.4, ease: "power2.inOut" }, 10.0);
      tl.to("#hl", { opacity: 0, duration: 0.2 }, 10.0);
      tl.to("#win", { y: 120, scale: 1.08, duration: 0.6, ease: "power3.inOut" }, 10.0);
      L.wordsOut("#h4", 12.35);
      L.out("#kicker", 12.3);

      // cierre
      tl.to("#stage", { scale: 0.9, opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power3.in" }, 12.45);
      L.outro(12.6);
      L.embers(23);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
