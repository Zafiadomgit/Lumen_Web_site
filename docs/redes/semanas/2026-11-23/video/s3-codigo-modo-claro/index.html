<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/lumen.js"></script>
    <link rel="stylesheet" href="assets/css/lumen.css" />
    <style>
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
      .kicker { top: 196px; }
      .head { top: 252px; font-size: 86px; }
      #h1 { font-size: 72px; top: 262px; }

      /* ventana del navegador con la web real (capturas en oscuro y claro) */
      #win { position: absolute; left: 60px; top: 478px; width: 960px; height: 402px; border-radius: 28px; overflow: hidden; background: #0d0c11;
        box-shadow: 0 50px 110px rgba(0,0,0,.6), inset 0 0 0 2px rgba(232,182,76,.22); }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #17151c; border-bottom: 1px solid rgba(255,255,255,.06); }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a3640; }
      .dot:nth-child(1) { background: #e0675a; } .dot:nth-child(2) { background: #e2b549; } .dot:nth-child(3) { background: #5fb760; }
      .url { margin-left: 18px; flex: 1; height: 30px; border-radius: 15px; background: #0d0c11; color: var(--muted); font-weight: 700; font-size: 18px; display: flex; align-items: center; padding: 0 18px; gap: 10px; }
      .url b { color: var(--ink); font-weight: 700; }
      .page { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; overflow: hidden; background: #0a090d; }
      .page img { position: absolute; left: 0; top: 0; width: 960px; height: 379px; }
      #shotL { opacity: 0; }
      #veil { position: absolute; left: 0; top: 0; width: 960px; height: 354px; }
      #win .finger { z-index: 3; }

      /* editor con el código real de js/main.js */
      #ed { position: absolute; left: 60px; top: 908px; width: 960px; height: 420px; border-radius: 28px; overflow: hidden; background: #141218;
        box-shadow: 0 50px 110px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.07); }
      #ed .bar { justify-content: flex-start; }
      .file { margin-left: 18px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 19px; color: var(--muted); }
      .file b { color: var(--ink); }
      .tag { margin-left: auto; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 16px; color: #0a090d; background: var(--gold); border-radius: 8px; padding: 3px 10px; }
      .code { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; padding: 20px 0; }
      #hl { position: absolute; left: 0; right: 0; top: 20px; height: 37px; background: rgba(232,182,76,.15); box-shadow: inset 5px 0 0 var(--gold); opacity: 0; }
      .pane { position: absolute; left: 0; right: 0; top: 20px; }
      .ln { height: 37px; line-height: 37px; padding: 0 28px; white-space: pre; font-variant-ligatures: none; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; color: #e9e4d8; }
      .ln .k { color: #e8b64c; font-weight: 700; } .ln .n { color: #f0a66b; } .ln .s { color: #9fd39a; } .ln .c { color: #948e81; } .ln .x { color: #948e81; }
      .ln .f { color: #8fc3ea; }

      #outro .sign span { color: var(--muted); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="llama-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" /><stop offset="1" stop-color="#e8862c" /></linearGradient>
        <symbol id="lumen-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="currentColor" /><path d="M32 14c8 9 12 15 12 21.5a12 12 0 0 1-24 0C20 29 24 23 32 14z" fill="url(#llama-g)" /><path d="M32 30c3 3.5 4.5 6 4.5 8.5a4.5 4.5 0 0 1-9 0c0-2.5 1.5-5 4.5-8.5z" fill="#fff4dc" /></symbol>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="18" data-track-index="0" data-layout-ignore style="position:absolute;inset:0;z-index:1">
        <div id="glow"></div><div id="glow2"></div><div id="embers"></div>
      </div>

      <div id="kicker" class="kicker clip" data-start="0" data-duration="14.9" data-track-index="1" style="z-index:3"><i></i><span>Detrás del código</span><i></i></div>

      <h1 id="h1" class="head clip" data-start="0" data-duration="2.6" data-track-index="2" style="z-index:4"><span class="w">El</span> <span class="w">modo</span> <span class="w"><em>claro</em></span><br /><span class="w">nace</span> <span class="w">del</span> <span class="w"><em>farol</em></span></h1>
      <h1 id="h2" class="head clip" data-start="2.6" data-duration="3.8" data-track-index="2" style="z-index:4"><span class="w"><em>Bloque</em></span> <span class="w">a</span> <span class="w"><em>bloque</em></span>,<br /><span class="w">desde</span> <span class="w">la</span> <span class="w">luz</span></h1>
      <h1 id="h3" class="head clip" data-start="6.4" data-duration="4" data-track-index="2" style="z-index:4"><span class="w">Y</span> <span class="w">para</span> <span class="w">volver</span>,<br /><span class="w">se</span> <span class="w"><em>rompe</em></span></h1>
      <h1 id="h4" class="head clip" data-start="10.4" data-duration="4.5" data-track-index="2" style="z-index:4"><span class="w">Pruébalo</span> <span class="w">en</span><br /><span class="w"><em>nuestra</em></span> <span class="w"><em>web</em></span></h1>

      <div id="stage" class="clip" data-start="0" data-duration="15.1" data-track-index="3" style="position:absolute;inset:0;z-index:2">
        <div id="win">
          <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="url">🔒 <b>lumenestudio.tech</b></div></div>
          <div class="page">
            <img id="shotD" src="assets/img/web-dark.png" alt="" />
            <img id="shotL" src="assets/img/web-light.png" alt="" />
            <canvas id="veil" width="1920" height="708"></canvas>
            <div class="finger" id="finger"></div>
          </div>
        </div>
        <div id="ed">
          <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="file">js/<b>main.js</b></span><span class="tag">1c · modo claro</span></div>
          <div class="code">
            <div id="hl"></div>
            <div class="pane" id="p1"></div>
            <div class="pane" id="p2"></div>
            <div class="pane" id="p3"></div>
          </div>
        </div>
      </div>

      <div id="outro" class="clip" data-start="15" data-duration="3" data-track-index="4" style="z-index:5">
        <div class="farol"></div>
        <div class="champi"></div>
        <p class="slogan" id="slogan"><span class="w">Encendemos</span><br /><span class="w">tus</span> <span class="w"><em>ideas.</em></span></p>
        <p class="sign" id="sign"><svg aria-hidden="true"><use href="#lumen-mark" /></svg><b>Lumen Studio</b><span>· lumenestudio.tech</span></p>
      </div>
    </div>
    <script>
      const END = 18;
      const tl = gsap.timeline({ paused: true });
      const L = Lumen(tl, END);

      // ---------- código real de js/main.js (sección 1c); «…» = líneas que se saltan ----------
      const PANES = {
        p1: [
          "var toggleTheme = function (btn) {",
          "  if (switching) return;",
          "  var toLight = doc.getAttribute('data-theme') !== 'light';",
          "  …",
          "  var src = $('lamp'), r = (src || btn).getBoundingClientRect();",
          "  var ox = r.left + r.width / 2, oy = r.top + r.height * 0.55;",
          "  …",
          "};",
        ],
        p2: [
          "var blocks = function (ctx, w, h, ox, oy, swap, done) {",
          "  var size = Math.max(64, Math.round(Math.min(w, h) / 6.5)), gap = 6;",
          "  …",
          "    if (d > maxD) maxD = d;",
          "  …",
          "  var draw = function (k, out) {",
          "    …",
          "      if (out) e = 1 - e;",
        ],
        p3: [
          "var dir = Math.atan2(my - oy, mx - ox);",
          "…",
          "// grietas que avanzan desde el farol",
          "var cracks = function (k) {",
          "  var reach = ease(k) * R;",
          "  …",
          "};",
          "…",
          "if (f >= 1) { swap(); swapped = true; t0 = t; }",
        ],
      };
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const paint = (line) => {
        const re = /(\/\/.*$)|('[^']*')|\b(var|function|if|for|return)\b|\b(\d+(?:\.\d+)?)\b|(…)|\b([A-Za-z_]\w*)(?=\s*\()/g;
        let out = "", last = 0, m;
        while ((m = re.exec(line))) {
          out += esc(line.slice(last, m.index));
          const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "n" : m[5] ? "x" : "f";
          out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
          last = re.lastIndex;
        }
        return out + esc(line.slice(last));
      };
      for (const id in PANES) document.getElementById(id).innerHTML = PANES[id].map((l) => '<div class="ln">' + paint(l) + "</div>").join("");
      gsap.set(".pane", { opacity: 0 });

      const LH = 37;
      let curPane = null;
      const pane = (id, t) => {
        if (curPane) tl.to(curPane, { opacity: 0, y: -26, duration: 0.25, ease: "power2.in" }, t - 0.25);
        tl.set("#" + id, { opacity: 1, y: 0 }, t);
        tl.fromTo("#" + id + " .ln", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.22, stagger: 0.04, ease: "power2.out" }, t);
        tl.to("#hl", { opacity: 0, duration: 0.15 }, t - 0.25);
        curPane = "#" + id;
      };
      const hl = (id, i, t) => {
        tl.set("#hl", { y: i * LH }, t - 0.01);
        tl.fromTo("#hl", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
        tl.to("#" + id + " .ln", { opacity: (k) => (k === i ? 1 : 0.42), duration: 0.25, ease: "power2.out" }, t);
      };

      // ---------- el efecto de js/main.js: mismos números, azar con semilla fija, todo en función del tiempo ----------
      const VW = 1366, VH = 900;                       // ventana del navegador en la captura
      const SC = 1920 / VW;                            // lienzo de 1920 px de ancho para 960 px en pantalla
      const cv = document.getElementById("veil"), ctx = cv.getContext("2d");
      const mk = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const ease = (t) => (t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3));
      const rrect = (c, x, y, ww, hh, rad) => {
        rad = Math.min(rad, ww / 2, hh / 2);
        c.beginPath(); c.moveTo(x + rad, y); c.arcTo(x + ww, y, x + ww, y + hh, rad); c.arcTo(x + ww, y + hh, x, y + hh, rad);
        c.arcTo(x, y + hh, x, y, rad); c.arcTo(x, y, x + ww, y, rad); c.closePath();
      };

      // oscuro → claro: bloques redondeados en ola desde el farol (WAVE 900, GROW 520, HOLD 160) y luego se retiran
      const WAVE = 900, GROW = 520, HOLD = 160;
      const makeBlocks = (ox, oy, seed) => {
        const rnd = mk(seed), w = VW, h = VH;
        const size = Math.max(64, Math.round(Math.min(w, h) / 6.5)), gap = 6;
        const cols = Math.ceil(w / size) + 1, rows = Math.ceil(h / size) + 1, list = []; let maxD = 0;
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const cx = x * size + size / 2, cy = y * size + size / 2, d = Math.hypot(cx - ox, cy - oy);
          const roll = rnd();
          list.push({ x: x * size, y: y * size, d, c: roll < 0.1 ? "#e8a33a" : roll < 0.16 ? "#141218" : "#f6f4ef" });
          if (d > maxD) maxD = d;
        }
        const draw = (k, out) => {
          for (const c of list) {
            const local = (k - (c.d / maxD) * WAVE) / GROW; let e = ease(local);
            if (out) e = 1 - e;
            if (e <= 0.001) continue;
            const full = size + 1, s = (out ? full : full - gap * (1 - e)) * e, inset = (full - s) / 2;
            ctx.fillStyle = out ? "#f6f4ef" : e > 0.999 ? "#f6f4ef" : c.c;
            rrect(ctx, c.x + inset, c.y + inset, s, s, 18 * (1 - e) + (out ? 18 * (1 - e) : 2));
            ctx.fill();
          }
        };
        const SWAP = WAVE + GROW + HOLD, TOTAL = SWAP + WAVE + GROW;
        return { total: TOTAL / 1000, swapAt: SWAP / 1000, frame(k) {
          if (k < SWAP) draw(k, false);
          else if (k < TOTAL) { if (k - SWAP < 1) { ctx.fillStyle = "#f6f4ef"; ctx.fillRect(0, 0, w, h); } draw(k - SWAP, true); }
        } };
      };

      // claro → oscuro: grietas desde el farol (CRACK 750) y pedazos que caen (FALL 1200, retraso hasta 380)
      const CRACK = 750, FALL = 1200;
      const makeShatter = (ox, oy, seed) => {
        const r = mk(seed), w = VW, h = VH;
        const R = Math.hypot(Math.max(ox, w - ox), Math.max(oy, h - oy)) + 80;
        const N = 16, angles = [], rings = [0, 70, 170, 300, 470, 680, 940, 1250, 1650, 2200].filter((v, i, arr) => i === 0 || arr[i - 1] < R);
        rings.push(rings[rings.length - 1] * 1.4 + 200);
        for (let i = 0; i < N; i++) angles.push((i + 0.25 + r() * 0.5) / N * Math.PI * 2);
        const pt = (ri, ai) => {
          const rad = rings[ri] * (ri ? 0.72 + r() * 0.5 : 0), a = angles[ai % N] + (ri ? (r() - 0.5) * 0.22 : 0);
          return [ox + Math.cos(a) * rad, oy + Math.sin(a) * rad];
        };
        const grid = rings.map((_, ri) => angles.map((_, ai) => pt(ri, ai)));
        const ringSeg = rings.map((_, ri) => angles.map(() => ri > 0 && r() < (ri < 3 ? 0.75 : 0.42)));
        const kink = rings.map(() => angles.map(() => (r() - 0.5) * 26));
        const shards = [];
        for (let ri = 0; ri < rings.length - 1; ri++) for (let ai = 0; ai < N; ai++) {
          const poly = [grid[ri][ai], grid[ri][(ai + 1) % N], grid[ri + 1][(ai + 1) % N], grid[ri + 1][ai]];
          let mx = 0, my = 0; poly.forEach((p) => { mx += p[0] / 4; my += p[1] / 4; });
          const dir = Math.atan2(my - oy, mx - ox);
          shards.push({ p: poly, cx: mx, cy: my, d: Math.hypot(mx - ox, my - oy), vx: Math.cos(dir) * (60 + r() * 140), vy: Math.sin(dir) * 80 - 120 - r() * 120, rot: (r() - 0.5) * 2.4 });
        }
        const cracks = (k) => {
          const reach = ease(k) * R;
          ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(20,18,24,.55)"; ctx.beginPath();
          for (let ai = 0; ai < N; ai++) {
            ctx.moveTo(ox, oy);
            for (let ri = 1; ri < rings.length; ri++) {
              if (rings[ri - 1] > reach) break;
              const p0 = grid[ri - 1][ai], q = grid[ri][ai];
              ctx.lineTo((p0[0] + q[0]) / 2 + kink[ri][ai], (p0[1] + q[1]) / 2 - kink[ri][ai] * 0.6); ctx.lineTo(q[0], q[1]);
            }
          }
          for (let rj = 1; rj < rings.length; rj++) {
            if (rings[rj] > reach) break;
            for (let aj = 0; aj < N; aj++) {
              if (!ringSeg[rj][aj]) continue;
              const a1 = grid[rj][aj], a2 = grid[rj][(aj + 1) % N];
              ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]);
            }
          }
          ctx.stroke();
        };
        let maxDelay = 0; for (const s of shards) maxDelay = Math.max(maxDelay, (s.d / R) * 380);
        return { total: (CRACK + maxDelay + FALL) / 1000, swapAt: CRACK / 1000, frame(k) {
          if (k < CRACK) {
            const f = Math.min(1, k / CRACK);
            ctx.fillStyle = "rgba(246,244,239," + (ease(f) * 0.96).toFixed(3) + ")"; ctx.fillRect(0, 0, w, h);
            cracks(f);
          } else {
            const k2 = k - CRACK;
            for (const sh of shards) {
              const delay = (sh.d / R) * 380, tt = Math.max(0, (k2 - delay) / 1000);
              const life = tt / (FALL / 1000), dx = sh.vx * tt, dy = sh.vy * tt + 0.5 * 3000 * tt * tt, ang = sh.rot * tt, alpha = life < 0.7 ? 1 : 1 - Math.min(1, (life - 0.7) / 0.3);
              if (alpha <= 0) continue;
              ctx.save(); ctx.globalAlpha = alpha;
              ctx.translate(sh.cx + dx, sh.cy + dy); ctx.rotate(ang); ctx.translate(-sh.cx, -sh.cy);
              ctx.beginPath(); ctx.moveTo(sh.p[0][0], sh.p[0][1]); for (let j = 1; j < 4; j++) ctx.lineTo(sh.p[j][0], sh.p[j][1]); ctx.closePath();
              ctx.fillStyle = "#f6f4ef"; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(20,18,24,.35)"; ctx.stroke();
              ctx.restore();
            }
          }
        } };
      };

      // tres toques en el botón de modo (centro del farol medido en la captura: oscuro 680,306; claro 683,251)
      const BTN = { x: 1100.75 * 960 / VW, y: 40 * 960 / VW };          // botón del sol/luna, en px de la ventana
      const TAPS = [0.9, 6.6, 10.6];
      const EV = [
        { t: TAPS[0] + 0.15, fx: makeBlocks(680, 306, 1831) },
        { t: TAPS[1] + 0.15, fx: makeShatter(683, 251, 2417) },
        { t: TAPS[2] + 0.15, fx: makeBlocks(680, 306, 5099) },
      ];
      const lightAt = (t) => {
        let light = false;
        for (const e of EV) if (t >= e.t + e.fx.swapAt) light = e.fx === EV[1].fx ? false : true;
        return light;
      };
      const shotL = document.getElementById("shotL");
      const clock = { t: 0 };
      const render = () => {
        const t = clock.t;
        shotL.style.opacity = lightAt(t) ? 1 : 0;
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.setTransform(SC, 0, 0, SC, 0, 0);
        for (const e of EV) if (t >= e.t && t <= e.t + e.fx.total) e.fx.frame((t - e.t) * 1000);
      };
      tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: render }, 0);
      render();

      // dedo
      const F = L.finger("#finger");
      for (const t of TAPS) { F.tap(t, BTN.x, BTN.y); F.leave(t + 0.5); }

      // ---------- código y titulares ----------
      tl.set("#p1", { opacity: 1 }, 0);
      curPane = "#p1";
      hl("p1", 2, 0.35);
      hl("p1", 4, 1.4);
      L.wordsOut("#h1", 2.4);

      L.wordsIn("#h2", 2.65);
      pane("p2", 2.75);
      hl("p2", 1, 3.1);
      hl("p2", 3, 3.9);
      hl("p2", 7, 4.7);
      L.wordsOut("#h2", 6.2);

      L.wordsIn("#h3", 6.45);
      pane("p3", 6.5);
      hl("p3", 4, 6.95);
      hl("p3", 8, 7.6);
      hl("p3", 0, 8.3);
      L.wordsOut("#h3", 10.15);

      L.wordsIn("#h4", 10.45);
      tl.to("#ed", { opacity: 0, y: 60, filter: "blur(6px)", duration: 0.4, ease: "power2.inOut" }, 10.4);
      tl.to("#hl", { opacity: 0, duration: 0.2 }, 10.4);
      tl.to("#win", { y: 150, scale: 1.08, duration: 0.6, ease: "power3.inOut" }, 10.4);
      L.wordsOut("#h4", 14.65);
      L.out("#kicker", 14.7);

      // cierre
      tl.to("#stage", { scale: 0.9, opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power3.in" }, 14.85);
      L.outro(15);
      L.embers(23);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
